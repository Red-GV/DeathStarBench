global:
  nameOverride: ""
  fullnameOverride: ""
  mainChart: hotelres
  replicas: 1
  imagePullPolicy: "IfNotPresent"
  restartPolicy: Always
  serviceType: ClusterIP
  dockerRegistry: docker.io
  defaultImageVersion: latest
  serviceDnsDomain: "cluster.local"
  services:
    environments:
      # TLS enablement
      #  - 0: Disable
      #  - 1: Enabled, using default cipher suite based on golang runtime
      #  - TLS_XXX: Enabled, using the specified Cipher suite, see tls/options.go#L22
      TLS: 0
      LOG_LEVEL: "INFO"
      JAEGER_SAMPLE_RATIO: "0.01"
      MEMC_TIMEOUT: "2"
      GC: "100"
  affinity: {}
  tolerations: []
  nodeSelector: {}
  memcached:
    HACount: 1
    environments:
      MEMCACHED_CACHE_SIZE: "128"
      MEMCACHED_THREADS: "2"
  mongodb:
    persistentVolume:               # use hostPath or pvprovisioner
      enabled: false
      size: "1Gi"
      hostPath:
        enabled: false
        path: /tmp
      pvprovisioner:
        enabled: false
        storageClassName: ceph-fs   # optional

consul:
  enabled: true
  fullnameOverride: consul
  dns:
    enabled: false
  connectInject:
    enabled: false

jaeger:
  enabled: true
  fullnameOverride: jaeger
  provisionDataStore:
    cassandra: false
  allInOne:
    enabled: true
    args:
      - "--memory.max-traces=5000"
      - "--query.base-path=/jaeger/ui"
  resources:
      limits:
        memory: 400Mi
  storage: 
    type: memory
  agent:
    enabled: false
  collector:
    enabled: false
  query:
    enabled: false